services:
  nginx:
    container_name: gouden_draak_test_nginx
    ports: !override
      - "8082:80"

  app:
    container_name: gouden_draak_test_app
    env_file:
      - app/.env.test
    depends_on:
      - mysql

  scheduler:
    container_name: gouden_draak_test_scheduler
    env_file:
      - app/.env.test

  vite:
    container_name: gouden_draak_test_vite
    command: npm run dev -- --host 0.0.0.0 --port 5174
    env_file:
      - app/.env.test
    ports: !override
      - "5174:5174"

  mysql:
    container_name: gouden_draak_test_mysql
    environment:
      MYSQL_DATABASE: gouden_draak_test
      MYSQL_USER: gouden_draak
      MYSQL_PASSWORD: gouden_draak
      MYSQL_ROOT_PASSWORD: root
    ports: !override
      - "3308:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./webfs_old/gouden_draak_create_script.sql:/legacy-source/gouden_draak_create_script.sql:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    container_name: gouden_draak_test_phpmyadmin
    ports: !override
      - "8083:80"

  legacy:
    profiles:
      - legacy

volumes:
  mysql_test_data:

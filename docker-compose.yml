services:
  nginx:
    image: nginx:1.27-alpine
    container_name: gouden_draak_nginx
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app
      - reverb

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gouden_draak_app
    working_dir: /var/www/html/app
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - vite

  vite:
    image: node:22
    container_name: gouden_draak_vite
    working_dir: /var/www/html/app
    command: npm run dev -- --host 0.0.0.0
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gouden_draak_reverb
    working_dir: /var/www/html/app
    command: php artisan reverb:start --host=0.0.0.0 --port=8008 --debug
    environment:
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8008
      - REVERB_DEBUG=true
      - TZ=Europe/Amsterdam
    ports:
      - "8008:8008"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: gouden_draak_scheduler
    working_dir: /var/www/html/app
    command: php artisan schedule:work
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: gouden_draak_mysql
    environment:
      MYSQL_DATABASE: gouden_draak_app
      MYSQL_USER: gouden_draak
      MYSQL_PASSWORD: gouden_draak
      MYSQL_ROOT_PASSWORD: root
      TZ: Europe/Amsterdam
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./webfs_old/gouden_draak_create_script.sql:/legacy-source/gouden_draak_create_script.sql:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: gouden_draak_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      TZ: Europe/Amsterdam
    ports:
      - "8081:80"
    depends_on:
      - mysql

  composer:
    image: composer:2
    container_name: gouden_draak_composer
    profiles:
      - tools
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html

  node:
    image: node:22
    container_name: gouden_draak_node
    profiles:
      - tools
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html

volumes:
  mysql_data:

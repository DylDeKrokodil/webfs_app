<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/webfs_old

    <Directory /var/www/html/webfs_old>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gouden-draak-legacy-error.log
    CustomLog ${APACHE_LOG_DIR}/gouden-draak-legacy-access.log combined
</VirtualHost>

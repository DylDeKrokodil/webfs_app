<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/app/public

    <Directory /var/www/html/app/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gouden-draak-error.log
    CustomLog ${APACHE_LOG_DIR}/gouden-draak-access.log combined
</VirtualHost>

